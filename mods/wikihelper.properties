classname=wurmwiki.WikiMod
classpath=wikihelper.jar
sharedClassLoader=true

# Download each entry's picture from the wiki the first time it is opened (then it is cached on disk)
downloadImages=true
# How many entries the "Most searched" and "Recent" tabs show
popularCount=10
recentCount=5
# Show a page's Contents list right under the title (true), or after the item box (false)
contentsAtTop=true
# Write popup details to the client log (use if "Find in Wiki" does not show up on right-click menus)
debug=false
# Only show "Find in Wiki" on menus for things that exist in pages.txt
onlyWhenFound=true
